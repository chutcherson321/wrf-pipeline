name: wrf-run

on:
  schedule:
    # DISCRETE crons, not interval syntax. Measured over 12 h from 02:00Z on
    # 2026-08-28: workflows written with discrete daily crons delivered nearly
    # every slot (GRIB ingest 18 of ~20, pre-render 5 of 5), while both
    # interval-syntax workflows were heavily throttled -- DFV's "10 * * * *"
    # fired 3 of ~12 and this workflow's "15 */2 * * *" fired 2 of 6. It is not
    # frequency: GRIB fires more often than DFV and still lands ~90%. WRF went
    # 11 h overnight with no run at all and its output reached ~36 h stale.
    #
    # TREAT AS AN EXPERIMENT, NOT A DIAGNOSIS. The evidence is correlational and
    # one night deep, and GitHub does not document interval crons as lower
    # priority. If delivery has not improved within a day then syntax was not
    # the cause, and the fallback is to trigger off a workflow that IS delivered
    # reliably (workflow_run on the GRIB ingest would give ~18 per 12 h).
    #
    # Hourly rather than 2-hourly now that a slot is cheap to lose: the plan job
    # exits in ~20 s when nothing is missing, and a dropped hour then costs an
    # hour of latency instead of two. wavetrak-fetch#103 respelled DFV the same
    # way.
    - cron: "15 0 * * *"
    - cron: "15 1 * * *"
    - cron: "15 2 * * *"
    - cron: "15 3 * * *"
    - cron: "15 4 * * *"
    - cron: "15 5 * * *"
    - cron: "15 6 * * *"
    - cron: "15 7 * * *"
    - cron: "15 8 * * *"
    - cron: "15 9 * * *"
    - cron: "15 10 * * *"
    - cron: "15 11 * * *"
    - cron: "15 12 * * *"
    - cron: "15 13 * * *"
    - cron: "15 14 * * *"
    - cron: "15 15 * * *"
    - cron: "15 16 * * *"
    - cron: "15 17 * * *"
    - cron: "15 18 * * *"
    - cron: "15 19 * * *"
    - cron: "15 20 * * *"
    - cron: "15 21 * * *"
    - cron: "15 22 * * *"
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: Site key (must exist in the private config repo)
        default: cloudbreak
      forcing:
        description: Forcing model (auto = every one that is missing)
        type: choice
        options: [auto, gfs, ifs]
        default: auto
      cycle:
        description: Cycle YYYYMMDDHH, or "auto" for newest complete (ignored when forcing=auto)
        default: auto
      hours:
        description: Forecast length (hours, multiple of 6; IFS max 240)
        default: "168"
      budget_min:
        description: wrf.exe wall-clock budget per segment (minutes)
        default: "280"
      restart_interval_min:
        description: Restart cadence (minutes of model time)
        default: "720"
      upload_wrfout:
        description: Attach wrfout_d02 netCDF to the private release
        type: boolean
        default: true

# This is a PUBLIC repo: the workflow gets a read-only token for this repo,
# never writes here, and publishes results only to the private repo below.
# All inter-job artifacts are encrypted with the ARTIFACT_KEY secret because
# artifacts on a public repo are publicly downloadable.
permissions:
  contents: read

env:
  CONFIG_REPO: chutcherson321/wavetrak-wrf

# One run at a time — but a run now covers BOTH forcings in parallel lanes, so
# this no longer serializes GFS behind IFS. A tick that lands mid-run queues
# instead of starting a duplicate, and by the time it starts its targets are
# usually published, so it exits in seconds.
concurrency:
  group: wrf-run
  cancel-in-progress: false

jobs:
  # Cheap decision job: what is missing that we can actually run right now?
  # A manual dispatch always wins; a scheduled tick proceeds only when a cycle
  # is genuinely absent AND its forcing data is already on the server.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # JSON array of {forcing, cycle} — one lane per entry, "[]" for nothing
      targets: ${{ steps.decide.outputs.targets }}
      site: ${{ steps.decide.outputs.site }}
      hours: ${{ steps.decide.outputs.hours }}
    env:
      GH_TOKEN: ${{ secrets.CONFIG_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide
        id: decide
        run: |
          chmod +x scripts/*.sh
          SITE="${{ inputs.site || 'cloudbreak' }}"
          HOURS="${{ inputs.hours || '168' }}"
          WANT="${{ inputs.forcing || 'auto' }}"
          { echo "site=$SITE"; echo "hours=$HOURS"; } >> "$GITHUB_OUTPUT"

          # WRF runs 00/12z ONLY -- CH's decision, and make_manifest.py's
          # WRF_RUNS = [0, 12] encodes the same thing so the page can say "not
          # run" rather than "pending" at 06/18z. The cycle resolvers walk back
          # in SIX-hour steps though, so they happily return a 06z or 18z cycle
          # and the planner had no restriction: a 4.5 h run would occupy a lane
          # producing a cycle nobody asked for, delaying the 12z one behind it.
          # 06z -> 00z and 18z -> 12z of the same day; if the later cycle was
          # complete the earlier one certainly is.
          to_wrf_cycle() {
            case "${1:8:2}" in
              00|12) echo "$1" ;;
              06)    echo "${1:0:8}00" ;;
              18)    echo "${1:0:8}12" ;;
              *)     echo "$1" ;;
            esac
          }
          cycle_for() {
            local c
            if [ "$1" = "ifs" ]; then c=$(scripts/latest_ifs_cycle.sh "$HOURS" 2>/dev/null || true)
            else c=$(scripts/latest_cycle.sh "$HOURS" 2>/dev/null || true); fi
            [ -n "$c" ] && to_wrf_cycle "$c" || true
          }
          # Step back a whole backbone cycle (12 h). GNU date on the runners,
          # BSD date locally -- same fallback pattern latest_cycle.sh uses.
          back12() {
            date -u -d "${1:0:8} ${1:8:2}:00:00 -12 hours" +%Y%m%d%H 2>/dev/null \
              || date -u -j -v-12H -f "%Y%m%d%H" "$1" +%Y%m%d%H
          }
          TARGETS=""
          add() { TARGETS="$TARGETS{\"forcing\":\"$1\",\"cycle\":\"$2\"},"; }

          # Naming one forcing is an instruction, not a suggestion: it runs even
          # if that cycle is already published (that is how you force a redo).
          if [ "$WANT" != "auto" ]; then
            C="${{ inputs.cycle || 'auto' }}"
            [ "$C" = "auto" ] && C=$(cycle_for "$WANT")
            [ -n "$C" ] || { echo "no $WANT cycle with complete data"; exit 1; }
            echo "dispatch: $WANT $C"
            add "$WANT" "$C"
          else
            # Every forcing with an unpublished cycle in the recent window.
            # Both are queued at once and integrate in parallel lanes.
            #
            # RETRY WINDOW: this used to look at the newest complete cycle and
            # nothing else, so a cycle whose run failed was NEVER retried -- the
            # pipeline simply waited for the next one and left a permanent hole
            # in the history. Walking back two backbone cycles (24 h) means one
            # failure gets picked up on the next tick instead. Newest first, so
            # a backfill never delays current guidance; bounded at 24 h because
            # beyond that the forcing data starts ageing out upstream and a
            # queued run would fail at the download instead.
            for F in gfs ifs; do
              C=$(cycle_for "$F")
              if [ -z "$C" ]; then echo "$F: no cycle with complete data yet"; continue; fi
              PICK=""
              TRY="$C"
              for _ in 1 2 3; do
                if scripts/is_published.sh "$CONFIG_REPO" "$SITE" "$F" "$TRY"; then
                  echo "$F $TRY: already published"
                else
                  PICK="$TRY"; break
                fi
                TRY=$(back12 "$TRY")
              done
              if [ -z "$PICK" ]; then continue; fi
              C="$PICK"
              echo "$F $C: MISSING - queueing a lane"
              add "$F" "$C"
            done
          fi
          echo "targets=[${TARGETS%,}]" >> "$GITHUB_OUTPUT"
          echo "planned: [${TARGETS%,}]"

  # One lane per missing forcing. fail-fast off: a broken IFS mirror must not
  # take down a healthy GFS run.
  run:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    name: ${{ matrix.target.forcing }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    uses: ./.github/workflows/wrf-forcing.yml
    with:
      site: ${{ needs.plan.outputs.site }}
      forcing: ${{ matrix.target.forcing }}
      cycle: ${{ matrix.target.cycle }}
      hours: ${{ needs.plan.outputs.hours }}
      budget_min: ${{ inputs.budget_min || '280' }}
      restart_interval_min: ${{ inputs.restart_interval_min || '720' }}
      upload_wrfout: ${{ github.event_name != 'workflow_dispatch' && true || inputs.upload_wrfout }}
    secrets: inherit
