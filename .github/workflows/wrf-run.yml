name: wrf-run

on:
  schedule:
    # A tick every two hours rather than four fixed shots. GitHub delays
    # scheduled events under load and DROPS them when the delay grows — on
    # 2026-08-27 both of the day's crons never fired and the 00z cycle was
    # simply lost. The `plan` job decides what is actually missing, so most
    # ticks cost ~20 s and a dropped tick self-heals two hours later.
    - cron: "15 */2 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: Site key (must exist in the private config repo)
        default: cloudbreak
      forcing:
        description: Forcing model (auto = every one that is missing)
        type: choice
        options: [auto, gfs, ifs]
        default: auto
      cycle:
        description: Cycle YYYYMMDDHH, or "auto" for newest complete (ignored when forcing=auto)
        default: auto
      hours:
        description: Forecast length (hours, multiple of 6; IFS max 240)
        default: "168"
      budget_min:
        description: wrf.exe wall-clock budget per segment (minutes)
        default: "280"
      restart_interval_min:
        description: Restart cadence (minutes of model time)
        default: "720"
      upload_wrfout:
        description: Attach wrfout_d02 netCDF to the private release
        type: boolean
        default: true

# This is a PUBLIC repo: the workflow gets a read-only token for this repo,
# never writes here, and publishes results only to the private repo below.
# All inter-job artifacts are encrypted with the ARTIFACT_KEY secret because
# artifacts on a public repo are publicly downloadable.
permissions:
  contents: read

env:
  CONFIG_REPO: chutcherson321/wavetrak-wrf

# One run at a time — but a run now covers BOTH forcings in parallel lanes, so
# this no longer serializes GFS behind IFS. A tick that lands mid-run queues
# instead of starting a duplicate, and by the time it starts its targets are
# usually published, so it exits in seconds.
concurrency:
  group: wrf-run
  cancel-in-progress: false

jobs:
  # Cheap decision job: what is missing that we can actually run right now?
  # A manual dispatch always wins; a scheduled tick proceeds only when a cycle
  # is genuinely absent AND its forcing data is already on the server.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # JSON array of {forcing, cycle} — one lane per entry, "[]" for nothing
      targets: ${{ steps.decide.outputs.targets }}
      site: ${{ steps.decide.outputs.site }}
      hours: ${{ steps.decide.outputs.hours }}
    env:
      GH_TOKEN: ${{ secrets.CONFIG_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide
        id: decide
        run: |
          chmod +x scripts/*.sh
          SITE="${{ inputs.site || 'cloudbreak' }}"
          HOURS="${{ inputs.hours || '168' }}"
          WANT="${{ inputs.forcing || 'auto' }}"
          { echo "site=$SITE"; echo "hours=$HOURS"; } >> "$GITHUB_OUTPUT"

          cycle_for() {
            if [ "$1" = "ifs" ]; then scripts/latest_ifs_cycle.sh "$HOURS" 2>/dev/null || true
            else scripts/latest_cycle.sh "$HOURS" 2>/dev/null || true; fi
          }
          TARGETS=""
          add() { TARGETS="$TARGETS{\"forcing\":\"$1\",\"cycle\":\"$2\"},"; }

          # Naming one forcing is an instruction, not a suggestion: it runs even
          # if that cycle is already published (that is how you force a redo).
          if [ "$WANT" != "auto" ]; then
            C="${{ inputs.cycle || 'auto' }}"
            [ "$C" = "auto" ] && C=$(cycle_for "$WANT")
            [ -n "$C" ] || { echo "no $WANT cycle with complete data"; exit 1; }
            echo "dispatch: $WANT $C"
            add "$WANT" "$C"
          else
            # Every forcing whose newest complete cycle is not published yet.
            # Both are queued at once and integrate in parallel lanes.
            for F in gfs ifs; do
              C=$(cycle_for "$F")
              if [ -z "$C" ]; then echo "$F: no cycle with complete data yet"; continue; fi
              if scripts/is_published.sh "$CONFIG_REPO" "$SITE" "$F" "$C"; then
                echo "$F $C: already published"; continue
              fi
              echo "$F $C: MISSING - queueing a lane"
              add "$F" "$C"
            done
          fi
          echo "targets=[${TARGETS%,}]" >> "$GITHUB_OUTPUT"
          echo "planned: [${TARGETS%,}]"

  # One lane per missing forcing. fail-fast off: a broken IFS mirror must not
  # take down a healthy GFS run.
  run:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    name: ${{ matrix.target.forcing }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    uses: ./.github/workflows/wrf-forcing.yml
    with:
      site: ${{ needs.plan.outputs.site }}
      forcing: ${{ matrix.target.forcing }}
      cycle: ${{ matrix.target.cycle }}
      hours: ${{ needs.plan.outputs.hours }}
      budget_min: ${{ inputs.budget_min || '280' }}
      restart_interval_min: ${{ inputs.restart_interval_min || '720' }}
      upload_wrfout: ${{ github.event_name != 'workflow_dispatch' && true || inputs.upload_wrfout }}
    secrets: inherit
